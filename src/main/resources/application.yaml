server:
  port: 8081
  servlet:
    context-path: /api
spring:
  application:
    name: aggregated-search-platform
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/aggregated_search_platform
    username: root
    password: 123456
mybatis-flex:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
logging:
  level:
    com.chipswu.aggregatedsearchplatform.mapper: DEBUG